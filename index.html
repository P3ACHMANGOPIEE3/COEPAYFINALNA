<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COE-Pay Centralized Gateway | ICCT Colleges Foundation, Inc.</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Forest Emerald Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            brand: ['Outfit', 'sans-serif'],
          }
        }
      }
    };

    // Full Universal Proxy/Mock Database Engine (Sinasalo ang lahat ng tawag para walang crash)
    (function() {
      const defaultClearance = {
        academic_year: '2023-2024',
        term_name: '1st Trimester',
        is_cleared: 1,
        pending_count: 0,
        total_dues: 0,
        paid_dues: 0
      };

      const baseDb = {
        getCurrentTerm: () => ({ academic_year: '2023-2024', term_name: '1st Trimester' }),
        getAssignments: () => [],
        getDues: () => [],
        getStudentDues: () => [],
        getTransactions: () => [],
        getTransactionsByStudent: () => [],
        getPayments: () => [],
        getPersonnel: () => [],
        getStudents: () => [],
        getUsers: () => [],
        getDispatchedEmails: () => [],
        getAuditLogs: () => [],
        getStudentClearanceStatus: () => defaultClearance,
        getUserById: (id) => null,
        findUserByIdentifier: (ident) => null,
        getPersonnelByUserId: () => null,
        getStudentByUserId: () => null,
        logAudit: () => {},
        save: () => {},
        resetToSeed: () => {}
      };

      window.coepayDb = new Proxy(baseDb, {
        get(target, prop) {
          if (prop in target) return target[prop];
          return function() { return []; };
        }
      });
    })();
  </script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between text-slate-800 antialiased relative selection:bg-emerald-700 selection:text-white">

  <!-- TOP GLOBAL NAVBAR -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-800 to-teal-950 text-amber-300 flex items-center justify-center font-bold text-lg shadow-sm flex-shrink-0">
          <i class="fa-solid fa-microchip"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold font-brand tracking-tight text-lg text-slate-900">COE-Pay Centralized Gateway</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900 font-mono">Official Gateway</span>
          </div>
          <p class="text-[10px] text-slate-500 font-medium tracking-tight">ICCT COLLEGES FOUNDATION, INC. • COLLEGE OF ENGINEERING & DIGITAL TECHNOLOGY</p>
        </div>
      </div>

      <div class="flex items-center gap-2" id="nav-user-controls">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Gateway Online</span>
        </span>
        <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" 
                class="px-3 py-1.5 rounded-xl border border-slate-200 hover:border-rose-200 text-slate-500 hover:text-rose-600 hover:bg-rose-50 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Reset / Logout</span>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main id="main-app-container" class="flex-1 w-full relative flex items-center justify-center py-8 px-4 sm:px-6 lg:px-8 overflow-hidden min-h-[calc(100vh-80px)]">
    <div id="login-view-container" class="w-full"></div>
    <div id="developer-view-container" class="w-full hidden"></div>
    <div id="personnel-view-container" class="w-full hidden"></div>
    <div id="admin-view-container" class="w-full hidden"></div>
    <div id="student-view-container" class="w-full hidden"></div>
  </main>

  <!-- HIDDEN MODAL BACKDROP -->
  <div id="global-modal-backdrop" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog" id="global-modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="global-modal-title">COE-Pay System Dialog</h3>
        <button class="modal-close-btn" onclick="window.coeApp && window.coeApp.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="global-modal-body"></div>
      <div class="modal-footer" id="global-modal-footer"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-3 text-center text-xs text-slate-400 font-mono z-10">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2 text-slate-300">
        <i class="fa-solid fa-building-columns text-emerald-400"></i>
        <span>COE-Pay Centralized Gateway • ICCT Colleges Foundation, Inc.</span>
      </div>
      <div class="flex items-center gap-4 text-[11px]">
        <span class="flex items-center gap-1 text-emerald-400 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Central Database Connected
        </span>
        <span class="text-slate-500">Version 2.4</span>
      </div>
    </div>
  </footer>

  <!-- CORE SCRIPTS -->
  <script src="js/supabase-config.js"></script>
  <script src="js/receipt-helper.js"></script>
  <script src="js/masterlist-upload.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/student-view.js"></script>
  <script src="js/admin-view.js"></script>
  <script src="js/personnel-view.js"></script>
  <script src="js/developer-view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
